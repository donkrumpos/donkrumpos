<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Before: a gift went to a rented platform, then was re-keyed by hand into Salesforce. After: the gift goes through Stripe and an edge function straight into Salesforce, and a receipt is sent.">
  <!-- The donor pipeline as two routes. Before: the line breaks where a person
       carried the data by hand. After: the same trip with the break closed.
       Rust marks the one step that changed. Colors are the site's tokens. -->
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#221c16"/></marker>
    <marker id="a-old" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#857662"/></marker>
    <marker id="a-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#97522b"/></marker>
  </defs>

  <rect width="1200" height="675" fill="#fbf8f1"/>

  <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="25" letter-spacing="4" fill="#5e5346">
    <text x="70" y="74">BEFORE · A RENTED PLATFORM</text>
    <text x="70" y="356">AFTER · A PIPELINE THEY OWN</text>
  </g>
  <line x1="70" y1="296" x2="1130" y2="296" stroke="#d6c9b0" stroke-width="2"/>

  <!-- BEFORE -->
  <g font-family="'Fraunces', 'Iowan Old Style', Palatino, Georgia, serif" font-size="36" fill="#5e5346" text-anchor="middle">
    <text x="150" y="146">Gift</text>
    <text x="450" y="146">Platform</text>
    <text x="1050" y="146">Salesforce</text>
    <text x="750" y="250" font-style="italic" fill="#97522b">re-keyed by hand</text>
  </g>
  <line x1="176" y1="188" x2="420" y2="188" stroke="#857662" stroke-width="4" marker-end="url(#a-old)"/>
  <line x1="476" y1="188" x2="1020" y2="188" stroke="#97522b" stroke-width="4" stroke-dasharray="4 16" stroke-linecap="round" marker-end="url(#a-rust)"/>
  <g fill="#fbf8f1" stroke="#857662" stroke-width="4">
    <circle cx="150" cy="188" r="15"/>
    <circle cx="450" cy="188" r="15"/>
    <circle cx="1050" cy="188" r="15"/>
  </g>

  <!-- AFTER -->
  <g font-family="'Fraunces', 'Iowan Old Style', Palatino, Georgia, serif" font-size="36" font-weight="600" fill="#221c16" text-anchor="middle">
    <text x="150" y="432">Gift</text>
    <text x="450" y="432">Stripe</text>
    <text x="750" y="432">Edge function</text>
    <text x="1050" y="432">Salesforce</text>
    <text x="786" y="604" text-anchor="start">Receipt sent</text>
  </g>
  <g stroke="#221c16" stroke-width="6">
    <line x1="150" y1="476" x2="420" y2="476" marker-end="url(#a-ink)"/>
    <line x1="450" y1="476" x2="720" y2="476" marker-end="url(#a-ink)"/>
    <line x1="750" y1="476" x2="1020" y2="476" marker-end="url(#a-ink)"/>
    <line x1="750" y1="476" x2="750" y2="566" marker-end="url(#a-ink)"/>
  </g>
  <g fill="#221c16" stroke="#fbf8f1" stroke-width="3">
    <circle cx="150" cy="476" r="17"/>
    <circle cx="450" cy="476" r="17"/>
    <circle cx="1050" cy="476" r="17"/>
    <circle cx="750" cy="592" r="17"/>
  </g>
  <circle cx="750" cy="476" r="21" fill="#97522b" stroke="#fbf8f1" stroke-width="3"/>
</svg>
